<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>DevBlog - Share your ideas with the world</title>
    <meta name="description" content="Blog platform for developers. Share your knowledge, discover amazing articles and connect with a community of developers." />
    <meta name="keywords" content="blog, development, programming, technology, articles, community, developers" />
    <meta name="author" content="DevBlog" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DevBlog - Share your ideas with the world" />
    <meta property="og:description" content="Blog platform for developers. Share your knowledge and connect with a community." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://devblog.com" />
    <meta property="og:site_name" content="DevBlog" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevBlog - Share your ideas with the world" />
    <meta name="twitter:description" content="Blog platform for developers. Share your knowledge and connect with a community." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://devblog.com" />
    
    <!-- Theme color -->
    <meta name="theme-color" content="#16a34a" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DevBlog",
      "description": "Blog platform for developers",
      "url": "https://devblog.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://devblog.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
